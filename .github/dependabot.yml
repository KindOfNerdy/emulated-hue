version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: ["patch", "minor"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        update-types: ["patch", "minor"]
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: weekly
    groups:
      docker-images:
        update-types: ["patch", "minor"]
