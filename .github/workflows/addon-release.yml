name: Add-on Release

# Creates a GitHub release (and tag) whenever the add-on version in
# addon/config.json changes. Nothing is built.
on:
  push:
    branches: [master]
    paths:
      - addon/config.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: echo "version=$(jq -r .version addon/config.json)" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from the changelog
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' addon/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Add-on version ${{ steps.version.outputs.version }}" > notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, nothing to do."
          else
            gh release create "$version" \
              --target "$GITHUB_SHA" \
              --title "$version" \
              --notes-file notes.md
          fi
