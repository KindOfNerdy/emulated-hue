name: Dependabot auto-merge

# Merges Dependabot PRs (patch updates only, also grouped ones) once all other
# checks passed, then starts the add-on release workflow. Any minor or major update
# in a PR keeps it open for review (the checks do not start the app yet).
on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    name: automerge
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that every dependency in the PR is a patch update
        id: safe
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          majors=$(jq '[.[] | select(.updateType != "version-update:semver-patch")] | length' <<<"$DEPS")
          total=$(jq 'length' <<<"$DEPS")
          if [ "$majors" -eq 0 ] && [ "$total" -gt 0 ]; then ok=true; else ok=false; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          # only pip and docker updates change the add-on image
          image=$(jq '[.[] | select(.packageEcosystem == "pip" or .packageEcosystem == "docker")] | length' <<<"$DEPS")
          if [ "$image" -gt 0 ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
          # changelog line: what was updated
          list=$(jq -r '[.[] | select(.packageEcosystem == "pip" or .packageEcosystem == "docker") | "\(.dependencyName) " + (if (.prevVersion // "") == "" then "" else "\(.prevVersion) → " end) + .newVersion] | join(", ")' <<<"$DEPS")
          echo "notes=Updated dependencies: $list" >> "$GITHUB_OUTPUT"
          echo "dependencies=$total majors=$majors ok=$ok release_relevant=$image"
          echo "$list"

      - name: Wait for the other checks, merge and release
        if: ${{ steps.safe.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE: ${{ steps.safe.outputs.release }}
          NOTES: ${{ steps.safe.outputs.notes }}
        run: |
          # give the other workflows time to register their checks
          sleep 90
          for i in $(seq 1 120); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "automerge")]')
            total=$(jq 'length' <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not))] | length' <<<"$runs")
            if [ "$failed" -gt 0 ]; then
              echo "A check failed, leaving the PR open for review."
              exit 0
            fi
            if [ "$total" -ge 1 ] && [ "$pending" -eq 0 ]; then
              gh pr merge "$PR" --squash -R "$GITHUB_REPOSITORY"
              # merges done with GITHUB_TOKEN do not trigger push workflows;
              # GitHub Actions updates do not change the image, so no release for them
              if [ "$RELEASE" = "true" ]; then
                gh workflow run addon.yml -R "$GITHUB_REPOSITORY" --ref master -f bump=true -f notes="$NOTES"
              fi
              exit 0
            fi
            sleep 30
          done
          echo "Checks did not finish in time, leaving the PR open."
