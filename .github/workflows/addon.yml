name: Add-on Image & Release

# Builds the add-on image (amd64 + aarch64), scans it, pushes it to GHCR and
# creates a GitHub release for the add-on version in addon/config.json.
# A weekly run checks whether the base image or s6-overlay changed (docker/base.lock).
# It also checks whether the published image has pending Debian (security) updates.
# If so, it rebuilds, bumps the patch version, updates the changelog and releases it.
# Only a version without a release yet is pushed, so released image tags never change.
# A merged Dependabot update is released the same way. Pull requests only build,
# smoke-test and scan the image; nothing is pushed or released for them.
on:
  pull_request:
    branches: [master]
    paths:
      - docker/**
      - emulated_hue/**
      - ci/**
      - requirements.txt
      - .github/workflows/addon.yml
  push:
    branches: [master]
    paths:
      - docker/**
      - emulated_hue/**
      - ci/**
      - requirements.txt
      - addon/config.json
      - .github/workflows/addon.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the patch version and release (used after a Dependabot merge)
        type: boolean
        default: false
      notes:
        description: Changelog line for the bump (what was updated)
        type: string
        default: ""

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('addon-pr-{0}', github.ref) || 'addon-image' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kindofnerdy/emulated-hue

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      bumped: ${{ steps.p.outputs.bumped }}
      init_lock: ${{ steps.p.outputs.init_lock }}
      base: ${{ steps.p.outputs.base }}
      s6: ${{ steps.p.outputs.s6 }}
      reason: ${{ steps.p.outputs.reason }}
      publish: ${{ steps.p.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version and check for base image updates
        id: p
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          current=$(jq -r .version addon/config.json)
          version="$current"; bumped=false; init_lock=false
          reason="Automatic rebuild on an updated base image or s6-overlay (security updates)."
          author=$(git log -1 --format=%an)
          pyver=$(sed -n 's/^ARG PYTHON_VERSION="\(.*\)"/\1/p' docker/Dockerfile)
          base=$(docker buildx imagetools inspect "python:${pyver}-slim" --format '{{.Manifest.Digest}}')
          s6=$(gh api repos/just-containers/s6-overlay/releases/latest --jq .tag_name)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ ! -f docker/base.lock ]; then
              init_lock=true
            elif [ "$(cat docker/base.lock)" != "$(printf 'base=%s\ns6=%s' "$base" "$s6")" ]; then
              bumped=true
              version="${current%.*}.$(( ${current##*.} + 1 ))"
            else
              # same base image: does the published image miss Debian updates?
              raw=$(docker run --rm --platform linux/amd64 --entrypoint sh "$IMAGE:$current" -c \
                'apt-get update -qq >/dev/null && apt-get -s upgrade | awk "/^Inst/{print \$2}"') \
                || { echo "::error::Could not check $IMAGE:$current for Debian updates"; exit 1; }
              pending=$(printf '%s\n' "$raw" | sed '/^$/d' | sort -u | paste -sd, - | sed 's/,/, /g')
              echo "pending Debian updates: ${pending:-none}"
              if [ -n "$pending" ]; then
                bumped=true
                version="${current%.*}.$(( ${current##*.} + 1 ))"
                reason="Automatic rebuild with Debian security updates: $pending."
              fi
            fi
          elif [ "${{ github.event.inputs.bump }}" = "true" ] || { [ "${{ github.event_name }}" = "push" ] && [ "$author" = "dependabot[bot]" ]; }; then
            bumped=true
            version="${current%.*}.$(( ${current##*.} + 1 ))"
            reason="${NOTES:-Updated dependencies (automatic Dependabot update).}"
          fi
          # only a version without a release yet is pushed; released tags never change
          if gh release view "$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then publish=false; else publish=true; fi
          {
            echo "version=$version"; echo "bumped=$bumped"; echo "init_lock=$init_lock"; echo "publish=$publish"
            echo "base=$base"; echo "s6=$s6"; echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "current=$current new=$version base=$base s6=$s6 bumped=$bumped init=$init_lock"

  image:
    needs: prepare
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          tags: scan:latest
          build-args: BUILD_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint python scan:latest -c "
          import aiohttp, cryptography, hass_client, zeroconf, pydantic
          import emulated_hue.ssl_cert, emulated_hue.web, emulated_hue.apiv1
          print('imports ok', aiohttp.__version__, cryptography.__version__)"
          docker run --rm --entrypoint sh scan:latest -c 'test -x /init && command -v bashio'

      - name: Start test against a fake Home Assistant
        run: ci/start_test.sh scan:latest

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' && needs.prepare.outputs.publish == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: ${{ github.event_name != 'pull_request' && needs.prepare.outputs.publish == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: BUILD_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=multi,mode=max

  release:
    needs: [prepare, image]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Commit lock file and version bump
        id: commit
        if: ${{ needs.prepare.outputs.bumped == 'true' || needs.prepare.outputs.init_lock == 'true' }}
        env:
          REASON: ${{ needs.prepare.outputs.reason }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          printf 'base=%s\ns6=%s\n' "${{ needs.prepare.outputs.base }}" "${{ needs.prepare.outputs.s6 }}" > docker/base.lock
          msg="Add base image lock file"
          if [ "${{ needs.prepare.outputs.bumped }}" = "true" ]; then
            current=$(jq -r .version addon/config.json)
            sed -i "s/\"version\": \"$current\"/\"version\": \"$version\"/" addon/config.json
            awk -v v="$version" -v r="$REASON" 'NR==1{print; print ""; print "## " v; print ""; print "- " r; next} {print}' addon/CHANGELOG.md > changelog.new
            mv changelog.new addon/CHANGELOG.md
            msg="Bump add-on version to $version (automatic rebuild)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/base.lock addon/config.json addon/CHANGELOG.md
          git commit -m "$msg"
          git pull --rebase origin master
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from the changelog
        run: |
          awk -v v="${{ needs.prepare.outputs.version }}" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' addon/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Add-on version ${{ needs.prepare.outputs.version }}" > notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          target="${{ steps.commit.outputs.sha }}"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, nothing to do."
          elif [ "${{ needs.prepare.outputs.init_lock }}" = "true" ]; then
            echo "Lock file initialised, no release needed."
          else
            gh release create "$version" \
              --target "${target:-$GITHUB_SHA}" \
              --title "$version" \
              --notes-file notes.md
          fi
